# OWASP LLM04 — Model Denial of Service
# Detects agents making abnormally high tool call rates
name: high_frequency_tool_abuse
version: "1.1.0"
owasp_ref: LLM04
description: >
  Detects agents calling tools at rates inconsistent with
  legitimate workflows. Targets recursive loops, flood attacks,
  and distributed abuse via sub-agent spawning.

thresholds:
  tool_call_rate_per_hour:
    warning: 5.0     # 2.5x baseline of 2/hr — log
    throttle: 10.0   # 5x baseline — rate limit
    block: 15.0      # 7.5x baseline — synthetic response

  sub_agent_spawn_depth:
    warning: 2
    throttle: 3
    block: 4         # max depth per APEX spec = 5, block at 4

score_penalties:
  warning: -25
  throttle: -75
  block: -200

enforcement_action: RATE_LIMIT
escalation_action: BLOCK
human_review_required: false

explainability_template:
  policy_fired: high_frequency_tool_abuse_v1
  policy_threshold: "Tool call rate >{threshold}/hr (>{zscore_threshold} sigma above baseline)"
  recommended_action: "Review agent task definition for recursive patterns"