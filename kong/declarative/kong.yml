_format_version: "3.0"
_transform: true

services:
  - name: test-upstream
    url: http://scoring-service:8080
    routes:
      - name: test-route
        paths:
          - /health
        methods:
          - GET
          - POST
        strip_path: false

    plugins:
      - name: agent-reputation
        config:
          redis_host: redis
          redis_port: 6379
          redis_password: are_redis_dev
          redis_user: are_admin
          redis_timeout_ms: 2000
          enforcement_mode: observe
          scoring_service_url: http://scoring-service:8080

      - name: rate-limiting
        config:
          second: 500
          policy: local
          limit_by: header
          header_name: X-Agent-Org-ID
          fault_tolerant: true
          hide_client_headers: false
          error_message: "Rate limit exceeded for org — 500 requests/second maximum"