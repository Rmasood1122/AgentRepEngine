services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 60 1
      --appendonly yes
      --appendfilename appendonly.aof
      --requirepass are_redis_dev
      --aclfile /etc/redis/users.acl
    volumes:
      - ./config/redis/users.acl:/etc/redis/users.acl:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "are_redis_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: are
      POSTGRES_PASSWORD: are_dev
      POSTGRES_DB: agentrepengine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U are"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

  scoring-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://are:are_dev@postgres:5432/agentrepengine?sslmode=disable
      REDIS_URL: redis://are_admin:are_redis_dev@redis:6379
      ENFORCEMENT_MODE: observe
      PORT: "8080"
      SIEM_WEBHOOK_URL: ""
      SCORING_API_KEY: "are-internal-key-change-in-production"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.6-ubuntu
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: bundled,agent-reputation
      KONG_LUA_PACKAGE_PATH: /kong/plugins/?.lua;;
      KONG_LOG_LEVEL: info
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/plugins:/kong/plugins
      - ./kong/declarative:/kong/declarative
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - scoring-service

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: are_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:
  redis-data: